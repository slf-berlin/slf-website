        text: |-
          Die nachbarschaftliche Grünfläche und der angrenzende Auwald verbinden Natur mit urbanem Leben, während vielfältige Wohnformen unterschiedliche Zielgruppen ansprechen. Ergänzt wird das Quartier durch den Schulkomplex mit Sporthalle und Sportflächen, welcher in den nächsten Jahren als flexibler Auslagerungs-standort dienen soll. 

          Mit Photovoltaik, Geothermie und biodiversitäts-fördernden Maßnahmen wird zudem ein Beitrag zur Klimaanpassung geleistet. Insgesamt zeigt die Darstellung ein innovatives Konzept für ein lebenswertes und zukunftssicheres Stadtquartier.
