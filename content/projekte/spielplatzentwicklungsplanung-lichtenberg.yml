      - type: text
        breite: "50"
        text: Ein weiterer zentraler Arbeitsschritt war die Entwicklung eines Bewertungssystems sowie die Erstellung ausführlicher Steckbriefe auf Block- und Grundstücksebene für öffentliche und private Spielflächen. Ergänzend dazu erfolgt eine Potenzialflächenanalyse, die öffentliche Spielplätze, private Spielflächen sowie ergänzende Hinweise zu Freizeit- und Begegnungspunkten umfasst.
