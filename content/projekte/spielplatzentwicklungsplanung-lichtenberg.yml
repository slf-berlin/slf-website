  - type: text
    text: Für den jeweiligen Versorgungsbereich wurde ein Standort- und Maßnahmenkonzept erarbeitet, das konkrete Vorschläge für Potenzialflächen zur Anlage öffentlicher Spielplätze beinhaltet. Ergänzt wurde dieses um Hinweise für den Ausbau von (temporären) Spielstraßen, (grünen) Wegebeziehungen mit Integration von Spielpunkten oder auch informellen Bewegungsangeboten.
