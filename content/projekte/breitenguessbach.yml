      - type: text
        breite: "50"
        text: "Die rurbane Perspektive: Dorf und Stadt sind heute vielerorts keine Gegenpole mehr, sondern unterschiedliche Erscheinungsformen urbanen Lebens. Aspekte des Ländlichen gewinnen jedoch für viele Menschen eine neue Attraktivität. Voraussetzung dafür ist die Existenz oder Schaffung markanter „rurbaner“ Orte. Das Konzept für die Neugestaltung der Ortsmitte von Breitengüßbach zielt daher auf die Stärkung dieser Narration. Mit dieser sollen die Gemeindestruktur oder einzelne ihrer Elemente nicht musealisiert werden, sondern Anwohner, Zuziehende oder Gäste sollen dafür interessiert werden, die „Erzählung“ des Orts fortzuschreiben."
