        text: |-
          Aktivierung einer innerörtlichen Flächenreserve für den Wohnungsbau. Vorhabenbezogene planungsrechtliche Sicherung der Projektplanung für die Errichtung eines nachhaltigen und sozial gemischten Wohnquartiers mit Mietwohnungen im Geschosswohnungsbau  (406 WE) sowie ergänzenden Gewerbeeinheiten und einer Kindertagespflege

          Festsetzung des vorhabenbezogenen Bebauungsplanes 13.04.2017 und Umsetzung des Bauvorhabens bis 2020.
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: |-
          Einbindung in die Konzeptentwicklung, Qualifizierung und Vertiefung des Planungskonzeptes im Rahmen einer Konzeptwerkstatt

          Koordinierung, Abstimmung und Berücksichtigung der Fachgutachten zu Verkehr, Immissionsschutz, Nieder-schlagsentwässerung und besonderem Artenschutz 

          Betreuung des Durchführungsvertrags
