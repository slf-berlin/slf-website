  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: |-
          Darstellung der Verdrängungsrisiken insbesondere durch konkurrierende Gewerbesparten sowie Wohnnutzungen; Überprüfung und Bewertung der planungsrechtlichen Instrumente zur Sicherung von Standorten der Kunstproduktion; 

          Durchführung eines Planspiels an drei typisierten Standorten in Anlehnung an Gebiete innerhalb des Bezirks Friedrichshain- Kreuzberg zur Überprüfung der planungs-rechtlichen Möglichkeiten und Konflikte bei der Sicherung der Produktionsstandorte
