      - type: text
        breite: "33"
        text: Der Entwurf zitiert den historischen Stadtgrundriss am Georg-Stock-Platz. Ziel ist es, bestehende Wegeverbindungen zu stärken und historische Bezüge wieder herauszuarbeiten. Es geht darum die Identität des Platzes und des gesamten Stadtteils zu stärken. Auf die derzeitig heterogene Situation vor Ort reagiert der Entwurf mit einer eindeutigen Stadt- und Freiraumstruktur welcher verlorengegangen historische Bezüge wieder herstellt und neue stadträumliche Verbindungen schafft.
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: Die neuen Gebäude vom Haus am Platz (Wohnhaus mit ca. 30 Wohnungen und einer aktiven Erdgeschosszone) und dem Haus der Jugend (Jugendzentrum) komplettieren den erhaltenswerten und platzflankierenden Baumbestand und schaffen so einen baulich und vegetativ gefassten Quartiersplatz. Im westlichen Platzbereich wird die Straßenprofilierung der Straße Kirchweg aufgehoben und niveaugleich zum Quartiersplatz gepflastert. Damit wird die Blockrandbebauung am Kirchweg zur westlichen Platzkante des Quartiersplatzes.
