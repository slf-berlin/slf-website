  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: Ein nach Norden verlaufender Verbindungsweg führt vom zentralen Quartiersplatz, vorbei ein einer grünen Ruhe Oase, dem „kleinen“ Georg-Stock-Platz direkt zum Balkon an der Drusel. Hier bleiben die sehr steilen Böschungsbereiche des Zulaufs zur Fulda unberührt. Vielmehr ragt ein „Druselbalkon“ über den Wasserlauf und ermöglicht so einen offenen, freien und vor allem sicheren Blick auf, über und in den Flusslauf.
