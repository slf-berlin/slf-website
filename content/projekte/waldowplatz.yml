        text: |-
          Erstellung vier verschiedener Varianten und zwei Vorzugsvarianten eines Konzeptes für die stufenweise Entwicklung eines Schulstandortes in Berlin-Oberschöneweide.

          Ergänzung um weitere sozialer Infrastruktur – eine Kindertagesstätte und eine Jugendfreizeiteinrichtung.
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: |-
          Etablierung einer gemischten Nutzungsstruktur mit dem Schwerpunkt Wohnen und Förderung gemischter Wohntypologien in allen Varianten zur sozialen Mischung der Bewohnerschaft und zur Attraktivität des Quartiers.   

          Schaffung attraktiver öffentlich nutzbarer Freiräume (u.a. Spielplätze, Quartiersplatz, Grünflächen) und einer nachhaltigen Quartiersentwicklung.
