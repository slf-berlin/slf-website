        text: Ausarbeitung verschiedener Wohntypologien mit dem Schwerpunkt Lärmschutz und sonstiger Schallschutzmaßnahmen aufgrund der stark belasteten Situation zwischen Autobahn, Bahnstrecke und Landesstraße.
