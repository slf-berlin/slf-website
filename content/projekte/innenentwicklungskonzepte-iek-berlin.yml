inhalt:
  - type: text
    text: |-
      **Ausgangspunkt**

      -   weiterhin hohe Wohnraumnachfrage bei tendenziell abnehmenden Fertigstellungszahlen im Wohnungsneubau in Berlin
      -   kleinteilige Innenentwicklung (< 50 WE) als bedeutsamer, kontinuierlicher Beitrag zur Erreichung der Neubauziele im Land Berlin unter Berücksichtigung der Prinzipien des StEP Wohnen 2040; jährlich durchschnittlich ca. 4.000 neue Wohneinheiten in Berlin
      -   Implementierung des informellen Planungsinstruments „Umsetzungsorientiertes Innenentwicklungskonzept“ (IEK) zur Förderung der kleinteiligen Innenentwicklung

      **Zielsetzung von umsetzungsorientierten Innenentwicklungskonzepten**

      -   Ermittlung und Aktivierung von Potenzialen der Innenentwicklung für Wohnungsneubau und sonstige Nutzungen (sozial, grün, gewerblichen etc.) in stadträumlich integrierten, gut erschlossenen Lagen und Identifizierung von Schlüsselgrundstücken für eine kurz- bis mittelfristige Aktivierung
      -   pro-aktive, grundstücksübergreifende Planung durch die Bezirke jenseits vorhabenbezogener Konzepte von Eigentümern und Eigentümerinnen (ET)
      -   frühzeitige Klärung und Berücksichtigung erforderlicher Bedarfe und vorhandener Defizite wie u.a. der sozialen und grünen Infrastruktur sowie möglicher Hemmnisse bei der Aktivierung der Potenziale
      -   Stärkung der Identifikation seitens des Bezirks mit dem IEK aufgrund der proaktiven Bearbeitung durch das Bezirksamt und der Politik
