      - type: text
        breite: "50"
        text: |-
          **Zielsetzung der Auswertung und Prozessbegleitung**

          -   Auswertung der vorliegenden IEK und Ableitung übertragbarer Hinweise und Empfehlungen für den weiteren Prozess
          -   Fortführung und Etablierung des Instruments IEK im Zusammenhang mit dem StEP Wohnen 2040 und Sicherung der notwendigen Haushaltsmittel
          -   Förderung und Verstetigung eines kontinuierlichen Informations- und Wissensaustauschs zwischen den Bezirken untereinander und mit SenStadt
          -   Präsentation und Diskussion von Ansätzen in der Aktivierung von neuen Wohnbaupotenzialen aus anderen deutschen Städten durch Einbeziehung externer Experten und Vorstellung ausgewählter Beispiele
