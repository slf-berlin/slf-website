        text: Zusätzlich gibt es multifunktionale Quartiersparks welche als Pocketparks gleichmäßig im Quartier verteilt sind. Sie beinhalten Spiel- und  Retentionsflächen und bieten so nicht nur wohnungsnahe und nutzungsintensive Grünflächen sondern tragen zur Regulierung des Stadtklimas einen erheblichen Anteil bei.
