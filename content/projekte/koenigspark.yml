      - type: text
        breite: "66"
        text: Mit dem ca. 57 ha großen Plangebiet „Königspark“ besitzt Königs Wusterhausen eine wichtige Potenzialfläche zur Gestaltung dieser Entwicklungen. Der vorliegende Rahmenplan soll als Gesamtkonzept Ideen entwickeln und städtebauliches Grundgerüst für die weitere Entwicklung festlegen. Ziel ist, die Grundlagen für einen lebendigen Zukunftsort zu schaffen, der auch Leuchtturmcharakter für die gesamte Region besitzt. In mehreren Bauabschnitten sollen im neuen „Königspark“ fünf Quartiere und eine große Grünfläche nach und nach wachsen – dabei soll es immer wieder Raum und Möglichkeiten für Anpassungen und Weiterentwicklungen geben.
