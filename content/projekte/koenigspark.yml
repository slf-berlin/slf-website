  - type: text
    text: Auf Grundlage des Rahmenplans soll ab 2024 die Aufstellung von einem Bebauungsplan bzw. von Teilbebauungsplänen die planungsrechtliche Grundlage für eine Quartiersentwicklung geschaffen werden.
