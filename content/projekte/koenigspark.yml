inhalt:
  - type: text
    text: "**Erarbeitung einer Rahmenplanung für eine nachhaltige Quartiersentwicklung mit Bebauungsvorschlägen und Konzeptionen für die Freiraumgestaltung für einen potenziellen Gewerbestandort in Königs-Wusterhausen.**"
  - type: spalten
    spalten:
      - type: text
        breite: "33"
        text: Die Stadt Königs Wusterhausen befindet sich innerhalb der dynamisch wachsenden Hauptstadt-region Berlin-Brandenburg und ist eingebettet in ein Netz aus „Zukunftsorten“ im Bereich von Wissen-schaft und Forschung. Innerhalb dieses Korridors, der seit den letzten Jahren ein qualitatives und quantitatives Wachstum erfährt, werden weiterhin zukunftsfähige Arbeitsplätze, Wohnraum, soziale Infrastruktur sowie Flächen für Freizeit und Erholung entstehen.
