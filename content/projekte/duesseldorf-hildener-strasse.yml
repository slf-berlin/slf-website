      - type: text
        breite: "33"
        text: "Umstrukturierungskonzept für das ca. 21,8 ha Planungsgebiet in Düsseldorf-Benrath als Grundlage für die Neunutzung eines 2015 stillgelegten Industriestandortes. Das durch Hauptverkehrstrassen begrenzte Gebiet soll zu einem vielfältigen und offenen Stadtquartier mit einem feinmaschigen Netz aus Verbindungselementen in die angrenzenden Quartiere entwickelt werden. Das Quartier bietet neue Kombinationen des Wohnen und Arbeiten und setzt sich aus fünf differenzierten Stadtbausteinen zusammen: Stadtteilschule, Werkhof, Gewerbe, Wohnhöfe und Quartierspark."
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: Die Anforderungen an eine nachhaltige Quartiersentwicklung werden durch Dachbegrünung, Regenwassermanagement, und vielfältige Freiflächenangebote erfüllt. Aktive und passive Schallschutzmaßnahmen ermöglichen trotz des hohen Lärmpegels attraktive Wohnlagen. Das Konzept eines autoarmen Wohnquartiers wird durch mehrere Gemeinschaftsgtiefgaragen unterstützt.
