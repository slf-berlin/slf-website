      - type: text
        breite: "50"
        text: |-
          Kooperatives Verfahren zur Leitbildentwicklung für die ca. 26 ha große Fläche des ehemaligen Rangierbahnhofs Pankow zu einem innerstädtischen Wohnquartier mit ca. 1.200 WE, Schulstandort und Verkaufsflächen für Einzelhandel und Fachmärkte sowie der Freihaltung einer Tram – Trasse.

          Umfangreiche Beteiligung der Hauptakteure Eigentümerin, Senatsverwaltungen (SenSW und SenUVK) sowie den Fachämtern des Bezirks Pankow von Berlin.
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: |-
          Vorstellung und Diskussion mit politischen VertreterInnen des Bezirks sowie abschließend der Senatsbaudirektorin von Berlin.

          Analyse und Auswertung übergeordneter Rahmenbedingungen, Definition thematischer und sektoraler Handlungsfelder, Setzung programmatischer Schwerpunkte für drei Konzeptvarianten mit differenzierten Handlungsbedarfen.
