        text: |-
          Im Rahmen der Entwicklung des neuen Stadtquartiers „Blankenburger Süden“ wird die Teilfläche Süd (Gewerbegebiet Heinersdorf) zu einem Modell für nachhaltige Stadtentwicklung. Ziel des Projekts ist die Schaffung eines urbanen Wohnquartiers, das Gewerbe, Freiraum, Mobilität und soziale Infrastruktur sowie die angrenzenden Landschaftsräume integriert. Das Gebiet zeichnet sich durch bestehende Freiraumstrukturen, groß-flächige, gewerbliche Areale und angrenzende aufgelockerte Wohnnutz-ungen aus.

          Die Vorbereitung und Prozesssteuerung des städtebaulich-freiraumplanerischen Realisierungswettbewerbs erfolgt im Auftrag der Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen in Kooperation mit der Eigentümer-gemeinschaft Gartenstadt Heinersdorf.
