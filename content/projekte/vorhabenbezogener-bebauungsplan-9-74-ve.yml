        text: Veranlassung für die Planaufstellung ist ein geplantes Vorhaben der Berliner Verkehrsbetriebe (BVG). Die Erforderlichkeit ergibt sich aus der von der BVG angestrebten Elektrifizierung ihrer Busflotte. Diese erfordert eine entsprechende Anpassung und Entwicklung der Betriebshofinfrastruktur. Neben der Umrüstung vorhandener Betriebshofstandorte sieht die Umsetzungsstrategie der BVG auch die Errichtung neuer Betriebshöfe im Berliner Stadtgebiet vor. In diesem Rahmen ist die Errichtung des neuen Betriebshofverbunds im Bezirk Treptow-Köpenick, Ortsteil Oberschöneweide beabsichtigt.
