      - type: text
        breite: "50"
        text: |-
          Das 4,7 ha große Grundstück des Dragonerareals und angrenzende Grundstücksflächen sind wichtige Potenzialflächen für die Entwicklung eines inner-städtischen Quartiers für Wohnen, Gewerbe, Kultur und soziale Einrichtungen. Durch die Übertragung des Grundstücks in das Landeseigentum Berlins bietet sich die Chance für die kooperative, partizipative\
          und gemeinwohlorientierte Entwicklung eines neuen Quartiers im Rahmen eines Werkstattverfahrens, in dem eine konsensuale Entscheidung angestrebt wird, die durch alle Kooperationspartner (Land, Bezirk, WBM, BIM, Vernetzungstreffen Rathausblock und Forum Rathaus- block) gleichermaßen vertreten und umgesetzt werden soll. Innerhalb eines klaren städtebaulichen Gerüstes und unter Einbeziehung und Transfomation der vorhandenen besonderen Situationen kann eine feldweise durchgeführte, prozessorientierte und situative
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: Herangehensweise die je nach Nutzergruppe spezifischen Ansprüche ermöglichen und die Bildung eines alltäglichen und doch besonderen Stadtbausteins sicher stellen. Ziel dieses Werkstatt-Verfahrens ist die gemeinsame Erarbeitung eines städtebaulichen Konzepts für das Plangebiet, das aus dem Dragonerareal, dem Grundstück des Finanzamts, dem Rathausgrundstück und dem Grundstück Obentrautstraße 31 besteht. Dabei wird eine konsensuale Entscheidung angestrebt, die durch alle Kooperationspartner gleichermaßen vertreten und umgesetzt werden soll.
