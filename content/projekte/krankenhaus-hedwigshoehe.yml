        text: |-
          Fortführung der ortsbezogenen und standortverträglichen Entwicklung des Krankenhausstandortes Hedwigshöhe innerhalb des übergeordneten Siedlungsvorhabens „Neue Gartenstadt Falkenberg“.

          Schaffung der planungsrechtlichen Voraussetzungen für die Ergänzung eines neuen Klinikgebäudes zur Unterbringung zusätzlicher Funktionsbereiche der psychiatrischen Klinik. Berücksichtigung der sensiblen naturräumlichen Lage im Übergang zur Falkenbergkuppe.
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: |-
          Kultivierung der historischen Gartenterrassen des Buntzelschen Landschaftsparks mit Sicherung gärtnerischer Nutzungen für Therapiezwecke sowie Rückbau und Begrünung der Stellplatzanlage an der Buntzelstraße.

          Erarbeitung wesentlicher Konzeptbausteine und Entwurfsparameter anhand einer Bebauungsstudie. Abgestimmte Modifizierung des Bebauungskonzepts im Ergebnis eines Architektenauswahlverfahrens.
