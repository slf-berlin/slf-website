        text: Die Festsetzungen des Bebauungsplanes schaffen Beurteilungskriterien für die vorhandene und zukünftige Bebauung in diesem Bereich, die allgemein verbindlich und nachvollziehbar sind sowie eine Präzisierung des laufenden Verwaltungshandelns bedeuten. Der Bebauungsplan ist für die geordnete städtebauliche Entwicklung und Ordnung des Gebietes gem. § 1 Abs. 3 BauGB erforderlich.
