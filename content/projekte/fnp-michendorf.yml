inhalt:
  - type: text
    text: Die Gemeinde Michendorf mit ihren sechs Ortsteilen Fresdorf, Langerwisch, Michendorf, Stücken, Wildenbruch und Wilhelmshorst im engeren Verflechtungsraum Berlin-Brandenburg beabsichtigt die Neuaufstellung eines gemeinsamen Flächennutzungsplans (FNP) und Landschaftsplans.
  - type: spalten
    spalten:
      - type: text
        breite: "33"
        text: |-
          Bereits die Erarbeitung des aktuell wirksamen FNPs von 2008 erfolgte durch die Zusammenarbeit von Stadt Land Fluss mit den Landschaftsplanern Fugmann Janotta Partner aus Berlin, einschließlich der Organisation und Durchführung der gemeindeinternen sowie der Öffentlichkeits- und Behördenbeteiligungen.

          Ziel ist es erneut, die zukünftige städtebauliche Entwicklung bis 2040 nachhaltig zu gestalten und die aktuellen Herausforderungen in den Bereichen Wohnen, Wirtschaft, Umwelt, Energie und Mobilität zu berücksichtigen. Gleichzeitig wird mit dem Landschaftsplan sichergestellt, dass die einzigartigen Natur- und Kulturlandschaften der Region geschützt und weiterentwickelt werden.
