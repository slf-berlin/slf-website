  - type: text
    text: |-
      Vor diesem Hintergrund wird ein Ortsteilentwicklungskonzept für den Ortsteil Knautkleeberg-Knauthain erarbeitet.

      In einem gemeinsamen, kooperativen Prozess mit den Bürgerinnen und Bürgern vor Ort sollen die Grundlagen der zukünftigen Entwicklung des Ortsteils diskutiert werden. Dabei wird herausgearbeitet, was unter Berücksichtigung des gesamtstädtischen Kontextes für den Ortsteil als Entwicklungsrichtung angemessen und zukunftsfähig ist.\
      Während des gesamten Erarbeitungsprozesses werden verschiedene Formate zur Information und Beteiligung stattfinden. Die Beteiligungsformate sollen unterschiedlichen Zielgruppen, wie zum Beispiel Kinder und Jugendliche, Pendlerinnen und Pendler oder Senioreninnen und Senioren, ansprechen.
