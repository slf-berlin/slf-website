  - type: text
    text: |-
      Aufbauend auf den vorangegangenen Arbeitsschritten der Bestandsanalyse erfolgte die Leitbildentwicklung, bestehend aus dem räumlichen Leitbild und dem so genannten Zielsystem. Das räumliche Leitbild ist die plangraphische Darstellung der wichtigsten Entwicklungsziele. Das Zielsystem fasst die Entwicklungsziele für den Ortsteil zusammen.

      Der Rahmenplan stellt das Grundgerüst für die nachfolgende Planungs- und Maßnahmenebene dar. Im Rahmenplan werden die bereits im Leitbild verankerten räumlichen Schwerpunktbereiche durch integrierte Maßnahmenvorschläge aus den Handlungsfeldern Daseinsvorsorge/Gemeinwesen, Siedlungsstruktur/Städtebau, Landschaft/Grünraum sowie Verkehr/ Mobilität unterlegt.

      Der Rahmenplan gibt Orientierung für das weitere Vorgehen und Arbeiten mit dem OEK und basiert auf den Ergebnissen des Beteiligungsprozesses.

      Das Handlungs- und Maßnahmenkonzept umfasst den Plan „Handlungs- und Maßnahmenplan“ sowie eine Tabelle mit den Handlungsfeldern und Maßnahmen.
