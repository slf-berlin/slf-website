inhalt:
  - type: text
    text: |-
      Das stetige Einwohnerwachstum in Leipzig führt dazu, dass Bauflächen in den inner städtisch gelegenen Gebieten knapper werden. Neben den Lückenschließungen in den inneren Stadtgebieten und dem Abschluss laufender Gebietsentwicklungen wird deutlich, dass es insbesondere für den individuellen Wohnungsbau Bedarfe in den äußeren Ortsteilen gibt.\
      Gleichzeitig werden seitens der aktuellen Einwohnerschaft in den äußeren Ortsteilen bereits jetzt ergänzende soziokulturelle und infrastrukturelle Bedarfe, wie zum Beispiel seniorengerechten Wohnformen, Verbesserung der Nahversorgungsmöglichkeiten und Erweiterungen von Sportfreiflächen signalisiert.\
      Darüber hinaus kommt den vorhandenen Freiraumstrukturen zukünftig eine wachsende Bedeutung für die Frisch- und Kaltluftentstehung sowohl für diesen Ortsteil als auch für die Gesamtstadt zu. Heute haben diese Flächen eine wichtige Funktion als landwirtschaftliche Produktionsflächen.
