  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: In einem städtebaulichen Testentwurf wurde eine beispielhafte Planung der Gebäude- und Freiraumstrukturen vorgenommen. Für das Wohnen wird eine Hofbildung mit begrünten Innenhöfen vorgeschlagen. Während an der Wolfgang-Heinz-Straße und am Quartiersplatz durch größere Baukörper eine räumliche Fassung erfolgt, ist zur Panke eine kleinteiligere und offene Gebäudestruktur vorgesehen. Die Gebäudehöhen orientieren sich mit sechs Geschossen an der östlich angrenzenden Bestandsbebauung, zur Panke sind fünf Geschosse geplant.
