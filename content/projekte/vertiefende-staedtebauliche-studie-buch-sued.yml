      - type: text
        breite: "50"
        text: Nachdem eine städtebauliche Rahmenplanung für das zentrale und südliche Gebiet von Buch durch das Bezirksamt am 05.05.2020 beschlossen wurde, sollen durch eine vertiefende städtebauliche Studie Vorschläge für die Weiterentwicklung der Wohnsiedlung Buch IV und die Aktivierung der Flächenpotenziale im Bereich zwischen der Ernst-Busch-Straße und dem südlich gelegenen Kappgraben gemacht werden. Wie kann ein vielfältiges und nachhaltiges Quartier aussehen, das eine Verknüpfung zu den Nachbarschaften schafft und sich in den umgebenden Landschaftraum einfügt?
  - type: spalten
    spalten:
      - type: text
        breite: "50"
        text: Neben der programmatischen Zielsetzung von ca. 650 Wohnungen im Geschoßwohnungsbau wird der südliche Bereich konzeptionell für die Entwicklung eines Gewerbegebietes, vorwiegend für Laborgebäude des Campus-Berlin-Buch GmbH, behandelt. Als weitere Programmpunkte sind eine Quartiersgarage, eine Kindertagesstätte mit bis zu 150 Plätzen und ein öffentlicher Kinderspielplatz vorzusehen.
