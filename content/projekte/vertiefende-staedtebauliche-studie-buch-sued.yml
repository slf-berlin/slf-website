        text: In dem folgenden Struktur- und Nutzungskonzept sind die wesentlichen Entwurfselemente für die Quartiersentwicklung aufgezeigt. Zum Vergleich wird daneben auch die aktuelle Situation im Plangebiet dargestellt.
